[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
rust-version = "1.84"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# "z" (13 November): about 8% smaller than "s", so less rent on mainnet; the full Solana suite runs on this build.
opt-level = "z"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
