[package]
name = "elpida_launchpad"
version = "0.2.0"
description = "Elpida locked-pool launchpad (Solana prototype, NOT AUDITED)"
edition = "2021"
license = "MIT"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "elpida_launchpad"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
